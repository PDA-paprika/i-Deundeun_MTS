spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

ls:
  api:
    app-key: ${LS_APP_KEY}
    app-secret: ${LS_APP_SECRET}
    base-url: https://openapi.ls-sec.co.kr:8080
    ws-url: wss://openapi.ls-sec.co.kr:9443/websocket
